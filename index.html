input,select,textarea,button{font-family:inherit;font-size:14px}
.btn{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:.2s}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:active{background:var(--green-l)}
.btn-outline{background:transparent;border:2px solid var(--green);color:var(--green)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:6px 14px;font-size:13px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--green-l);box-shadow:0 0 0 3px rgba(45,122,79,.15)}
input[readonly]{background:#f0f0f0;color:#555;cursor:not-allowed}
label{display:block;font-weight:600;margin-bottom:4px;color:var(--muted);font-size:13px}
.form-group{margin-bottom:14px}
.card{background:var(--card);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:12px}
#loginScreen,#configScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,var(--green),var(--green-l))}
.login-box{background:#fff;border-radius:16px;padding:32px;width:100%;max-width:380px;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.login-box h1{text-align:center;color:var(--green);margin-bottom:8px;font-size:22px}
.login-box p{text-align:center;color:var(--muted);margin-bottom:24px;font-size:13px}
#header{background:var(--green);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
#header h2{font-size:17px}
#header .user-area{display:flex;align-items:center;gap:8px}
#header .user-name{font-size:13px;opacity:.9}
.logout-btn{background:rgba(255,255,255,.2);color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px}
.lang-btn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700}
.lang-btn:hover{background:rgba(255,255,255,.3)}
.dashboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:0 16px 8px}
.group-header{display:flex;align-items:center;gap:12px;padding:20px 16px 4px;margin-top:8px}
.group-header:first-child{margin-top:0;padding-top:12px}
.group-icon{font-size:26px;line-height:1}
.group-title{font-size:15px;font-weight:700;color:var(--green);letter-spacing:.3px}
.group-desc{font-size:11px;color:var(--muted);margin-top:1px}
.dash-card{background:#fff;border-radius:12px;padding:18px 12px;text-align:center;cursor:pointer;transition:.2s;border:2px solid transparent}
.dash-card:active{transform:scale(.96);border-color:var(--green-l)}
.dash-card .icon{font-size:32px;margin-bottom:8px}
.dash-card .title{font-weight:700;font-size:13px}
.dash-card .desc{font-size:11px;color:var(--muted);margin-top:4px}
.section-header{display:flex;align-items:center;gap:8px;padding:16px 16px 8px;flex-wrap:wrap}
.section-header h3{flex:1;font-size:16px}
.back-btn{background:none;border:none;color:var(--green);font-weight:600;cursor:pointer;font-size:14px;padding:4px 8px}
.list-container{padding:0 16px 16px}
.list-item{background:#fff;border-radius:10px;padding:12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.06);display:flex;align-items:center;gap:8px}
.list-item .info{flex:1}
.list-item .info .main{font-weight:600;font-size:14px}
.list-item .info .sub{font-size:12px;color:var(--muted)}
.list-item .actions{display:flex;gap:6px}
.list-item .actions button{background:none;border:none;cursor:pointer;font-size:18px;padding:4px}
.form-container{padding:0 16px 24px}
.form-container .card{padding:20px}
.inv-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.inv-row:last-child{border:none}
.inv-row .label{color:var(--muted)}

.inv-badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700}

.abc-b{background:#fff3e0;color:#e65100}

let currentLang = localStorage.getItem('santagro_lang') || 'en';

function t(key, vars) {
  const dict = I18N[currentLang] || I18N.en;
  let s = dict[key];
  if (s === undefined) s = I18N.en[key] || key;
  if (vars) {
    for (const k in vars) s = s.replace('{' + k + '}', vars[k]);
  }
  return s;
}

function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const val = t(key);
    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
      el.placeholder = val;
    } else {
      el.textContent = val;
    }
  });
  const langLabel = document.getElementById('langLabel');
  const loginLangLabel = document.getElementById('loginLangLabel');
  if (langLabel) langLabel.textContent = currentLang === 'en' ? 'SW' : 'EN';
  if (loginLangLabel) loginLangLabel.textContent = currentLang === 'en' ? 'SW' : 'EN';
}

function toggleLanguage() {
  currentLang = currentLang === 'en' ? 'sw' : 'en';
  localStorage.setItem('santagro_lang', currentLang);
  applyI18n();
  if (currentUser && document.getElementById('mainApp').style.display === 'block') {
    showDashboard();
  }
}

// ============================================================
// 日期格式转换
// ============================================================
function isoToDDMMYYYY(iso) {
  if (!iso) return '';
  const s = String(iso).substring(0,10);
  const parts = s.split('-');
  if (parts.length !== 3) return s;
  return `${parts[2]}/${parts[1]}/${parts[0]}`;
}

function ddmmyyyyToISO(ddmmyyyy) {
  if (!ddmmyyyy) return null;
  const parts = String(ddmmyyyy).split('/');
  if (parts.length !== 3) return null;
  const dd = parts[0].padStart(2,'0');
  const mm = parts[1].padStart(2,'0');
  const yyyy = parts[2];
  if (yyyy.length !== 4) return null;
  return `${yyyy}-${mm}-${dd}`;
}

function parseAnyDate(str) {
  if (!str) return null;
  str = String(str).trim();
  if (!str) return null;
  let m = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) {
    const dd = parseInt(m[1]), mm = parseInt(m[2]), yyyy = m[3];
    if (dd > 12) return `${yyyy}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
    if (mm > 12) return `${yyyy}-${String(dd).padStart(2,'0')}-${String(mm).padStart(2,'0')}`;
    return `${yyyy}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
  }
  m = str.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);
  if (m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  const d = new Date(str);
  if (!isNaN(d.getTime())) {
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    return `${yyyy}-${mm}-${dd}`;
  }
  return null;
}

function parseAnyBool(str) {
  if (str === null || str === undefined) return null;
  const s = String(str).trim().toLowerCase();
  if (['true','1','yes','y','t'].includes(s)) return 'true';
  if (['false','0','no','n','f',''].includes(s)) return 'false';
  return null;
}

function todayDDMMYYYY() {
  const d = new Date();
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yyyy = d.getFullYear();
  return `${dd}/${mm}/${yyyy}`;
}

function nowHHMM() {
  const d = new Date();
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  return `${hh}:${mm}`;
}

function splitDatetime(iso) {
  if (!iso) return { date: '', time: '' };
  const d = new Date(iso);
  if (isNaN(d.getTime())) return { date: '', time: '' };
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yyyy = d.getFullYear();
  const hh = String(d.getHours()).padStart(2,'0');
  const mi = String(d.getMinutes()).padStart(2,'0');
  return { date: `${dd}/${mm}/${yyyy}`, time: `${hh}:${mi}` };
}

function mergeDatetime(dateStr, timeStr) {
  if (!dateStr) return null;
  const parts = String(dateStr).split('/');
  if (parts.length !== 3) return null;
  const [dd, mm, yyyy] = parts;
  const [hh, mi] = (timeStr || '00:00').split(':');
  const d = new Date(`${yyyy}-${mm}-${dd}T${hh.padStart(2,'0')}:${(mi||'00').padStart(2,'0')}:00`);
  if (isNaN(d.getTime())) return null;
  return d.toISOString();
}

function canView(key) {
  if (!currentUser) return false;
  if (currentUser.role === 'admin') return true;
  if (!currentUser.allowed_tables) return false;
  return currentUser.allowed_tables.includes(key);
}

function canEdit(key) {
  if (!currentUser) return false;
  if (currentUser.role === 'admin') return true;
  if (!currentUser.editable_tables) return false;
  return currentUser.editable_tables.includes(key);
}

function hasAccess(key) { return canView(key); }

function init() {
  const url = EMBEDDED_URL || localStorage.getItem('santagro_sb_url');
  const key = EMBEDDED_KEY || localStorage.getItem('santagro_sb_key');
  if (url && key) {

    showLogin();
  } else {

  }
}

function saveConfig() {
  const url = document.getElementById('sbUrl').value.trim();
  const key = document.getElementById('sbKey').value.trim();
  if (!url || !key) { toast(t('fillBothFields')); return; }
  localStorage.setItem('santagro_sb_url', url);
  localStorage.setItem('santagro_sb_key', key);
  sb = supabase.createClient(url, key);
  document.getElementById('configScreen').style.display = 'none';
  showLogin();
}

function showLogin() {
  document.getElementById('configScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  const params = new URLSearchParams(window.location.search);
  const preUser = params.get('u');
  document.getElementById('loginUser').value = preUser || '';
  document.getElementById('loginPass').value = '';
  const baseUrl = window.location.href.split('?')[0];
  const qrDiv = document.getElementById('loginQR');
  if (qrDiv) {
    qrDiv.innerHTML = '';
    try {
      if (typeof QRCode !== 'undefined') {
        new QRCode(qrDiv, {
          text: baseUrl,
          width: 160,
          height: 160,
          colorDark: '#1a5632',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.M
        });
      } else {
        qrDiv.textContent = baseUrl;
      }
    } catch(e) {
      console.warn('QR generation failed:', e);
    }
  }
  applyI18n();
}

async function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  if (!u || !p) { toast(t('enterUserPass')); return; }
  const hash = await sha256(p);
  const { data, error } = await sb.from('app_users')
    .select('*')
    .eq('username', u)
    .eq('password_hash', hash)
    .single();
  if (error || !data) { toast(t('invalidCreds')); return; }
  currentUser = data;
  localStorage.setItem('santagro_session', JSON.stringify({
    id: data.id,
    username: data.username,
    role: data.role,
    displayName: data.display_name,
    allowed_tables: data.allowed_tables,
    editable_tables: data.editable_tables
  }));
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  document.getElementById('userName').textContent = data.display_name || data.username;
  applyI18n();
  showDashboard();
}

function logout() {
  localStorage.removeItem('santagro_session');
  currentUser = null;
  document.getElementById('mainApp').style.display = 'none';
  showLogin();
}

      <div style="display:flex;gap:8px">
        <button class="btn btn-outline" style="flex:1" onclick="document.getElementById('pwdModal').remove()">${t('cancel')}</button>

    </div>

async function changePassword() {
  const oldPwd = document.getElementById('pwd_old').value;
  const newPwd = document.getElementById('pwd_new').value;
  const confirmPwd = document.getElementById('pwd_confirm').value;
  const errEl = document.getElementById('pwd_err');
  errEl.style.display = 'none';
  if (!oldPwd || !newPwd || !confirmPwd) { errEl.textContent = t('fillAllFields'); errEl.style.display = 'block'; return; }
  if (newPwd.length < 6) { errEl.textContent = t('pwdMinChars'); errEl.style.display = 'block'; return; }
  if (newPwd !== confirmPwd) { errEl.textContent = t('pwdNotMatch'); errEl.style.display = 'block'; return; }
  if (newPwd === oldPwd) { errEl.textContent = t('pwdSame'); errEl.style.display = 'block'; return; }
  const oldHash = await sha256(oldPwd);
  const { data: user, error: queryErr } = await sb.from('app_users')
    .select('id').eq('id', currentUser.id).eq('password_hash', oldHash).single();
  if (queryErr || !user) { errEl.textContent = t('pwdOldWrong'); errEl.style.display = 'block'; return; }
  const newHash = await sha256(newPwd);
  const { error } = await sb.from('app_users').update({ password_hash: newHash }).eq('id', currentUser.id);
  if (error) { errEl.textContent = t('errorPrefix') + error.message; errEl.style.display = 'block'; return; }
  document.getElementById('pwdModal').remove();
  toast(t('pwdChanged'), 5000);
  setTimeout(() => { logout(); }, 2000);
}

async function sha256(msg) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function toast(msg, ms=3000) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), ms);
}

  document.getElementById('headerTitle').textContent = `${cfg.icon} ${cfg.label}`;

  } else if (cfg.isEquipmentReport) {

  }

// ============================================================
// LIST VIEW
// ============================================================
async function showList(key) {
  const cfg = TABLES[key];
  const content = document.getElementById('content');
  // 清掉旧缓存，确保列表显示最新数据
  for (const f of cfg.fields) {
    if (f.type === 'link' || f.type === 'multilink') {
      for (const k of Object.keys(linkCache)) {
        if (k.startsWith(f.table + '_')) delete linkCache[k];
      }
    }
    if (f.type === 'lookup' && f.lookupCategory) {
      delete lookupCache[f.lookupCategory + '_loaded'];
      delete lookupCache[f.lookupCategory + '_ts'];
    }
  }
  for (const f of cfg.fields) {
    if (f.type === 'link' || f.type === 'multilink') await loadLinkCacheForField(f);
    if (f.type === 'lookup') await loadLookupCache(f.lookupCategory);
  }
  let query = sb.from(key).select('*');
  if (cfg.defaultSort) {
    query = query.order(cfg.defaultSort.column, { ascending: cfg.defaultSort.ascending });
    if (cfg.defaultSort.secondaryColumn) query = query.order(cfg.defaultSort.secondaryColumn, { ascending: cfg.defaultSort.secondaryAscending });
  } else {
    query = query.order('created_at', { ascending: false });
  }
  const { data, error } = await query;
  if (error) { toast(t('errorPrefix') + error.message); return; }
  const editable = canEdit(key);
  let html = `<div class="section-header">
    <button class="back-btn" onclick="goBack()">← ${t('back')}</button>
    <h3>${cfg.label}</h3>
    ${editable ? `<button class="btn btn-outline btn-sm" onclick="downloadCSVTemplate('${key}')">📄 Template</button>` : ''}
    ${editable ? `<button class="btn btn-outline btn-sm" onclick="importCSV('${key}')">📤 Import CSV</button>` : ''}
    <button class="btn btn-outline btn-sm" onclick="exportCSV('${key}')">📥 Export</button>
    ${editable ? `<button class="btn btn-primary btn-sm" onclick="showForm('${key}')">+ ${t('add')}</button>` : ''}
  </div>`;
  if (!data || data.length === 0) {
    html += `<div class="empty">${t('noRecords')}${editable ? ' ' + t('tapToAdd') : ''}</div>`;
  } else {
    html += `<div class="list-container">`;
    for (const row of data) {
      const primaryField = cfg.fields[0];
      let primaryVal = row[primaryField.col];
      if (primaryField.type === 'link') {
        primaryVal = linkCache[`${primaryField.table}_${row[primaryField.col]}`]?.[primaryField.showField] || row[primaryField.col];
      }
      const secondaryField = cfg.fields[1];
      let secondaryVal = '';
      if (secondaryField) {
        const sv = row[secondaryField.col];
        if (sv !== null && sv !== undefined && sv !== '') {
          if (secondaryField.type === 'link') secondaryVal = linkCache[`${secondaryField.table}_${sv}`]?.[secondaryField.showField] || sv;
          else if (secondaryField.type === 'multilink') secondaryVal = Array.isArray(sv) ? sv.map(id => linkCache[`${secondaryField.table}_${id}`]?.[secondaryField.showField] || id).join(', ') : sv;
          else if (secondaryField.type === 'multiselect' && Array.isArray(sv)) secondaryVal = sv.join(', ');
          else if (secondaryField.type === 'datetime') secondaryVal = new Date(sv).toLocaleString();
          else if (secondaryField.type === 'date') secondaryVal = isoToDDMMYYYY(sv);
          else secondaryVal = String(sv);
        }
      }
      const voided = row.voided ? ' voided' : '';
      const voidMark = row.voided ? ' <span style="color:#c62828;font-size:11px">[VOID]</span>' : '';
      html += `<div class="list-item${voided}">
        <div class="info">
          <div class="main">${escapeHtml(String(primaryVal || '#' + row.id))}${voidMark}</div>
          <div class="sub">${escapeHtml(String(secondaryVal))}</div>
        </div>
        ${editable ? `<div class="actions">
          ${!row.voided ? `<button onclick="showForm('${key}', ${row.id})" title="${t('edit')}">✏️</button>` : ''}
          <button onclick="deleteRecord('${key}', ${row.id})" title="${t('edit')}">🗑️</button>
        </div>` : ''}
      </div>`;
    }
    html += `</div>`;
  }
  content.innerHTML = html;
  if (editable) {
    const fab = document.createElement('button');
    fab.className = 'fab';
    fab.textContent = '+';
    fab.onclick = () => showForm(key);
    content.appendChild(fab);
  }
}

// ============================================================
// CSV EXPORT
// ============================================================
async function exportCSV(key) {
  const cfg = TABLES[key];
  for (const f of cfg.fields) {
    if (f.type === 'link' || f.type === 'multilink') await loadLinkCacheForField(f);
  }
  const { data, error } = await sb.from(key).select('*').order('created_at', {ascending: false});
  if (error) { toast(t('errorPrefix') + error.message); return; }
  if (!data || data.length === 0) { toast(t('noDataToExport')); return; }
  const headers = ['ID', ...cfg.fields.map(f => f.label), 'Created At'];
  const rows = [headers];
  for (const row of data) {
    const values = [row.id];
    for (const f of cfg.fields) {
      let val = row[f.col];
      if (val === null || val === undefined) val = '';
      else if (f.type === 'link') val = linkCache[`${f.table}_${val}`]?.[f.showField] || val;
      else if (f.type === 'multilink') val = Array.isArray(val) ? val.map(id => linkCache[`${f.table}_${id}`]?.[f.showField] || id).join('; ') : val;
      else if (f.type === 'multiselect' && Array.isArray(val)) val = val.join('; ');
      else if (f.type === 'datetime') val = new Date(val).toLocaleString();
      else if (f.type === 'date') val = isoToDDMMYYYY(val);
      values.push(String(val));
    }
    values.push(row.created_at ? new Date(row.created_at).toLocaleString() : '');
    rows.push(values);
  }
  const csv = rows.map(r => r.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob(['\ufeff' + csv], {type: 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${key}_export_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast(t('exportedCount', {n: data.length}));
}

function importCSV(key) {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.csv';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const text = await file.text();
    await processCSVImport(key, text);
  };

function parseCSV(text) {
  const rows = []; let row = []; let cell = ''; let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else inQuotes = false; }
      else cell += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') {
        if (cell !== '' || row.length > 0) { row.push(cell); rows.push(row); row = []; cell = ''; }
        if (c === '\r' && text[i+1] === '\n') i++;
      } else cell += c;
    }
  }
  if (cell !== '' || row.length > 0) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r.length === 1 && r[0] !== ''));
}

async function processCSVImport(key, text) {
  const cfg = TABLES[key];
  const rows = parseCSV(text);
  if (rows.length < 2) { toast('CSV must have header and at least one data row'); return; }
  if (rows.length > 501) {
    toast('CSV too large: max 500 data rows per import. Please split your file.', 6000);
    return;
  }
  const headers = rows[0].map(h => h.trim().toLowerCase());
  const dataRows = rows.slice(1);
  for (const f of cfg.fields) {
    if (f.type === 'link') await loadLinkCache(f.table, f.showField);
    if (f.type === 'lookup') await loadLookupCache(f.lookupCategory);
  }
  const successList = []; const failList = [];
  for (let i = 0; i < dataRows.length; i++) {
    const row = dataRows[i];
    try {
      const record = {};
      for (const f of cfg.fields) {
        if (f.previewOnly) continue;
        const idx = headers.findIndex(h => h === f.label.toLowerCase());
        if (idx === -1) continue;
        let val = (row[idx] || '').trim();
        if (val === '' && f.type !== 'date') continue;
        if (f.type === 'number' || f.type === 'range') {
          val = val === '' ? null : parseFloat(val);
          if (val !== null && isNaN(val)) throw new Error(`Invalid number for ${f.label}: "${row[idx]}"`);
        } else if (f.type === 'date') {
          val = val ? parseAnyDate(val) : null;
        } else if (f.type === 'datetime') {
          val = val ? parseAnyDate(val.substring(0,10)) : null;
          if (val) val = val + 'T00:00:00Z';
        } else if (f.type === 'link') {
          const items = Object.values(linkCache).filter(v => typeof v === 'object' && v.id && String(v[f.showField]).toLowerCase() === val.toLowerCase());
          if (items.length === 0) throw new Error(`Cannot find ${f.label}: "${val}"`);
          val = items[0].id;
        } else if (f.type === 'select' && f.opts) {
          const found = f.opts.find(o => o.toLowerCase() === val.toLowerCase());
          if (found) val = found;
        }
        record[f.col] = val;
      }
      for (const f of cfg.fields) {
        if (f.previewOnly || !f.required) continue;
        const v = record[f.col];
        if (v === null || v === undefined || v === '') throw new Error(`Missing required field: ${f.label}`);
      }
      successList.push(record);
    } catch (e) { failList.push({ row: i + 2, error: e.message }); }
  }
  if (successList.length > 0) {
    const { error } = await sb.from(key).insert(successList);
    if (error) { toast(t('batchInsertFailed') + error.message); return; }
  }
  let msg = t('importedCount', {n: successList.length});
  if (failList.length > 0) msg += `, failed ${failList.length}`;
  toast(msg, 5000);
  openModule(key);
}

// LINK CACHE（带 5 分钟过期 + 手动清）
// ============================================================
async function loadLinkCache(tableName, showField, extraFields) {
  const cacheKey = tableName + '_' + showField;
  const now = Date.now();
  const TTL = 5 * 60 * 1000;
  if (linkCache[cacheKey + '_loaded'] && linkCache[cacheKey + '_ts'] && (now - linkCache[cacheKey + '_ts'] < TTL)) {
    return;
  }
  const cols = ['id', showField, ...(extraFields || [])].join(',');
  const { data } = await sb.from(tableName).select(cols);
  if (data) {
    // 清掉旧条目
    for (const k of Object.keys(linkCache)) {
      if (k.startsWith(tableName + '_') && typeof linkCache[k] === 'object' && linkCache[k] && linkCache[k].id) {
        delete linkCache[k];
      }
    }
    for (const row of data) linkCache[`${tableName}_${row.id}`] = row;
    linkCache[cacheKey + '_loaded'] = true;
    linkCache[cacheKey + '_ts'] = now;
  }
}

async function loadLinkCacheForField(f) {
  if (f.table === 'inputs_inventory' || f.table === 'parts_inventory') {
    await loadLinkCache(f.table, f.showField, ['unit', 'avg_unit_price', 'current_stock', 'abc_class', 'warehouse_zone', 'bin_location']);
  } else if (f.table === 'equipment') {
    await loadLinkCache('equipment', f.showField, ['tank_capacity']);
  } else {
    await loadLinkCache(f.table, f.showField);
  }
}

// ============================================================
// LOOKUP CACHE（带 5 分钟过期）
// ============================================================
function normalizeLookupKey(v) {
  return String(v || '').toLowerCase().replace(/[\s\(\)（）]/g, '').replace(/(h|km|kg|l|t)$/i, '');
}

async function loadLookupCache(category) {
  if (!category) return;
  const now = Date.now();
  const TTL = 5 * 60 * 1000;
  if (lookupCache[category + '_loaded'] && lookupCache[category + '_ts'] && (now - lookupCache[category + '_ts'] < TTL)) {
    return;
  }
  const { data } = await sb.from('lookup_values').select('*').eq('category', category).eq('active', 'true');
  if (data) {
    const seen = new Set(); const unique = [];
    for (const item of data) {
      if (!item.value) continue;
      const key = normalizeLookupKey(item.value);
      if (seen.has(key)) continue;
      seen.add(key); unique.push(item);
    }
    lookupCache[category] = unique;
    lookupCache[category + '_loaded'] = true;
    lookupCache[category + '_ts'] = now;
  }
}

function getLookupOptions(category) {
  const items = lookupCache[category] || [];
  return items.map(i => ({value: i.value, label: i.label || i.value}));
}

// ============================================================
// 自动编号
// ============================================================
async function generateNextDocNumber(cfg, tableName) {
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, '0');
  const dd = String(today.getDate()).padStart(2, '0');
  const datePart = `${yyyy}${mm}${dd}`;
  const prefix = `${cfg.prefix}${datePart}-`;
  const { data } = await sb.from(tableName)
    .select(cfg.field)
    .like(cfg.field, prefix + '%')
    .order(cfg.field, { ascending: false })
    .limit(1);
  let nextSeq = 1;
  if (data && data.length > 0 && data[0][cfg.field]) {
    const parts = String(data[0][cfg.field]).split('-');
    const lastSeq = parseInt(parts[parts.length - 1], 10);
    if (!isNaN(lastSeq)) nextSeq = lastSeq + 1;
  }
  return prefix + String(nextSeq).padStart(cfg.digits, '0');
}

async function previewNewAvgPrice(tableName, inputId, intakeQty, unitPrice) {
  const { data: item } = await sb.from(tableName).select('current_stock, avg_unit_price').eq('id', inputId).single();
  const oldStock = Number(item?.current_stock) || 0;
  const oldAvg = Number(item?.avg_unit_price) || 0;
  const newStock = oldStock + Number(intakeQty);
  const newAvg = newStock > 0 ? ((oldStock * oldAvg) + (Number(intakeQty) * Number(unitPrice))) / newStock : 0;
  const deviation = oldAvg > 0 ? ((newAvg - oldAvg) / oldAvg) * 100 : 0;
  return { oldStock, oldAvg, newStock, newAvg, deviation };
}

async function applyIntakeToInventory(tableName, inputId, qty, unitPrice) {

// Maintenance Logs 停机时间自动计算
// ============================================================
function recalcDowntime() {
  const startDate = document.getElementById('fld_maintenance_date')?.value;
  const endDate = document.getElementById('fld_completion_date')?.value;
  const el = document.getElementById('fld_downtime_hours');
  if (!el) return;
  if (!startDate || !endDate) { el.value = ''; return; }
  const startISO = ddmmyyyyToISO(startDate);
  const endISO = ddmmyyyyToISO(endDate);
  if (!startISO || !endISO) { el.value = ''; return; }
  const days = (new Date(endISO) - new Date(startISO)) / 86400000;
  if (days < 0) { el.value = '0'; return; }
  el.value = (days === 0 ? 8 : days * 24).toFixed(1);
}

async function clearForm(key) {
  const ok = confirm(t('confirmClear'));
  if (!ok) return;
  const cfg = TABLES[key];
  const today = todayDDMMYYYY();
  const now = nowHHMM();
  for (const f of cfg.fields) {
    if (f.previewOnly) continue;
    const el = document.getElementById('fld_' + f.col);
    if (!el) continue;
    if (f.type === 'multilink' || f.type === 'multiselect') el.querySelectorAll('input:checked').forEach(c => { c.checked = false; });
    else if (f.type === 'range') { el.value = 0; const pctEl = document.getElementById('fld_' + f.col + '_pct'); if (pctEl) pctEl.textContent = '0%'; }
    else if (f.type === 'datetime') {
      const dateEl = document.getElementById('fld_' + f.col + '__date');
      const timeEl = document.getElementById('fld_' + f.col + '__time');
      if (dateEl) dateEl.value = today;
      if (timeEl) timeEl.value = now;
    }
    else if (f.type === 'date') el.value = today;
    else if (f.type === 'link' || f.type === 'lookup') { if (el.tomselect) el.tomselect.clear(); else el.value = ''; }
    else if (f.type === 'linkedreadonly') el.value = '';
    else el.value = '';
  }
  if (cfg.autoNumber) {
    const numEl = document.getElementById('fld_' + cfg.autoNumber.field);
    if (numEl) numEl.value = await generateNextDocNumber(cfg.autoNumber, key);
  }
  if (cfg.hasPartsUsed) { document.getElementById('partsUsedRows').innerHTML = ''; recalcPartsCost(); }
  if (cfg.hasPlannedInputs) document.getElementById('plannedInputsRows').innerHTML = '';
  if (key === 'fuel_intake') await autoFillFuelIntakePreview();
  if (key === 'fuel_output') await autoFillFuelOutputPrice();
  if (key === 'inputs_intake') await autoFillIntakePreview();
  if (key === 'inputs_output') await autoFillInputUnit();
  if (key === 'work_order_execution') recalcWorkOrderExecution();
  if (key === 'maintenance_logs') recalcDowntime();
  if (key === 'parts_intake') await autoFillPartsIntakePreview();
  if (key === 'parts_output' || key === 'parts_movements') await autoFillPartsOutput();
  toast(t('formCleared'));
}

async function addPlannedInputRow(data) {

  const div = document.createElement('div');
  div.className = 'planned-row'; div.id = rowId;
  let optsHtml = '<option value="">Select input...</option>';
  for (const item of inputItems) {

function onPartsUsedChange(rowId) {
  const row = document.getElementById(rowId);
  if (!row) return;
  const sel = row.querySelector('.planned-input-select');
  const unitEl = row.querySelector('.planned-unit');
  const priceEl = row.querySelector('.planned-price');
  const opt = sel.options[sel.selectedIndex];
  const unitVal = opt?.getAttribute('data-unit') || '';
  const priceVal = opt?.getAttribute('data-price') || '0';
  let unitLabel = unitVal;
  if (unitVal) { const found = getLookupOptions('unit').find(o => o.value === unitVal); if (found) unitLabel = found.label; }
  unitEl.value = unitLabel;
  priceEl.value = Number(priceVal).toFixed(2);
  recalcPartsCost();

function recalcPartsCost() {
  const rows = document.querySelectorAll('#partsUsedRows .planned-row');
  let total = 0;
  rows.forEach(r => {
    const price = parseFloat(r.querySelector('.planned-price')?.value) || 0;
    const qty = parseFloat(r.querySelector('.planned-qty')?.value) || 0;
    const rowTotal = price * qty;
    const totEl = r.querySelector('.planned-total');
    if (totEl) totEl.value = rowTotal.toFixed(2);
    total += rowTotal;
  });
  const display = document.getElementById('partsCostDisplay');
  if (display) display.textContent = total.toFixed(2);
  const laborEl = document.getElementById('fld_labor_cost');
  const costEl = document.getElementById('fld_cost');
  if (laborEl && costEl) costEl.value = ((parseFloat(laborEl.value) || 0) + total).toFixed(2);
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function recalcFuelOutput() {
  const prevReading = parseFloat(document.getElementById('fld_previous_reading')?.value) || 0;

  const litersAdded = parseFloat(document.getElementById('fld_liters_added')?.value) || 0;
  const unitPrice = parseFloat(document.getElementById('fld_unit_price')?.value) || 0;
  const fuelUsed = litersAdded;
  const deltaReading = currReading - prevReading;
  const consumptionRate = deltaReading > 0 ? (litersAdded / deltaReading) : 0;
  const totalValue = litersAdded * unitPrice;
  const setVal = (id, v) => { const el = document.getElementById(id); if (el) el.value = v.toFixed(2); };
  setVal('fld_fuel_used', fuelUsed);
  setVal('fld_consumption_rate', consumptionRate);

function recalcWorkOrderExecution() {
  const capacity = parseFloat(document.getElementById('fld_tank_capacity_display')?.value) || 0;
  const beforePct = parseFloat(document.getElementById('fld_fuel_before_pct')?.value) || 0;
  const afterPct = parseFloat(document.getElementById('fld_fuel_after_pct')?.value) || 0;
  const beforeWorkEl = document.getElementById('fld_fuel_before_work');
  const afterWorkEl = document.getElementById('fld_fuel_after_work');
  const consumedEl = document.getElementById('fld_fuel_consumed');
  const perHourEl = document.getElementById('fld_fuel_per_hour');
  const beforeL = capacity * beforePct / 100;
  const afterL = capacity * afterPct / 100;
  if (beforeWorkEl) beforeWorkEl.value = beforeL.toFixed(2);
  if (afterWorkEl) afterWorkEl.value = afterL.toFixed(2);
  const refueling = parseFloat(document.getElementById('fld_refueling_l')?.value) || 0;
  const consumed = beforeL + refueling - afterL;
  if (consumedEl) consumedEl.value = consumed.toFixed(2);
  const startTime = document.getElementById('fld_start_time__date')?.value;
  const startTimeT = document.getElementById('fld_start_time__time')?.value;
  const endTime = document.getElementById('fld_end_time__date')?.value;
  const endTimeT = document.getElementById('fld_end_time__time')?.value;
  if (startTime && endTime) {
    const startISO = mergeDatetime(startTime, startTimeT || '00:00');
    const endISO = mergeDatetime(endTime, endTimeT || '00:00');
    if (startISO && endISO) {
      const msDiff = Math.max(0, new Date(endISO) - new Date(startISO));
      const hours = msDiff / 3600000;
      if (perHourEl) perHourEl.value = hours > 0 ? (consumed / hours).toFixed(2) : '0';
    }
  } else {
    if (perHourEl) perHourEl.value = '';
  }
}

  const price = parseFloat(document.getElementById('fld_unit_price')?.value) || 0;
  const totalEl = document.getElementById('fld_total_value');
  if (totalEl) totalEl.value = (qty * price).toFixed(2);
  const newAvgEl = document.getElementById('fld_new_avg_preview');
  const devEl = document.getElementById('fld_deviation_preview');
  if (!partId || qty <= 0) {

    if (devEl) devEl.value = '';
    return;

  const { newAvg, deviation } = await previewNewAvgPrice('parts_inventory', partId, qty, price);
  if (newAvgEl) newAvgEl.value = newAvg.toFixed(4);
  if (devEl) devEl.value = deviation.toFixed(2);
}

async function autoFillPartsOutput() {
  const partId = document.getElementById('fld_part_id')?.value;
  const unitEl = document.getElementById('fld_unit_display');
  const locEl = document.getElementById('fld_location_display');
  const sysPriceEl = document.getElementById('fld_system_unit_price');
  const unitPriceEl = document.getElementById('fld_unit_price');
  if (!partId) {
    if (unitEl) unitEl.value = '';
    if (locEl) locEl.value = '';
    if (sysPriceEl) sysPriceEl.value = '';
    if (unitPriceEl) unitPriceEl.value = '';
    return recalcPartsOutputCost();
  }
  const item = linkCache[`parts_inventory_${partId}`];
  if (item) {
    if (unitEl) {
      const unitVal = item.unit;
      let unitLabel = unitVal || '';
      const found = getLookupOptions('unit').find(o => o.value === unitVal);
      if (found) unitLabel = found.label;
      unitEl.value = unitLabel;
    }
    if (locEl) locEl.value = [item.warehouse_zone, item.bin_location].filter(Boolean).join(' / ');

    if (sysPriceEl) sysPriceEl.value = avg.toFixed(4);
    if (unitPriceEl) unitPriceEl.value = avg.toFixed(4);

async function recalcPartsOutputCost() {
  const partId = document.getElementById('fld_part_id')?.value;
  const qty = parseFloat(document.getElementById('fld_actual_output_quantity')?.value) || 0;
  const unitPriceEl = document.getElementById('fld_unit_price');
  const totalEl = document.getElementById('fld_total_value');
  if (!partId) {
    if (totalEl) totalEl.value = '';
    return;
  }
  const item = linkCache[`parts_inventory_${partId}`];
  const avg = Number(item?.avg_unit_price) || 0;
  if (unitPriceEl) unitPriceEl.value = avg.toFixed(4);
  if (totalEl) totalEl.value = (qty * avg).toFixed(2);
}

async function revertInventoryEffect(key, oldRecord) {
  if (!oldRecord) return;
  try {
    if (key === 'fuel_intake') {
      const item = await getFuelItem(oldRecord.fuel_type, oldRecord.tank_location);
      if (item) {
        const oldStock = Number(item.current_stock) || 0;
        const qty = Number(oldRecord.intake_quantity) || 0;
        await sb.from('fuel_inventory').update({ current_stock: oldStock - qty }).eq('id', item.id);
      }
    } else if (key === 'fuel_output') {
      const item = await getFuelItem(oldRecord.fuel_type, oldRecord.tank_location);
      if (item) {
        const newStock = (Number(item.current_stock) || 0) + (Number(oldRecord.liters_added) || 0);
        await sb.from('fuel_inventory').update({ current_stock: newStock }).eq('id', item.id);
      }
    } else if (key === 'inputs_intake' || key === 'inputs_output' || key === 'inventory_movements') {
      const { data: item } = await sb.from('inputs_inventory').select('current_stock').eq('id', oldRecord.input_id).single();
      if (item) {
        let newStock = Number(item.current_stock) || 0;
        if (key === 'inputs_intake') newStock -= Number(oldRecord.intake_quantity) || 0;
        else if (key === 'inputs_output') newStock += Number(oldRecord.actual_output_quantity) || 0;
        else if (key === 'inventory_movements') newStock -= Number(oldRecord.quantity) || 0;
        await sb.from('inputs_inventory').update({ current_stock: newStock }).eq('id', oldRecord.input_id);
      }
    } else if (key === 'parts_intake' || key === 'parts_output' || key === 'parts_movements') {
      const { data: item } = await sb.from('parts_inventory').select('current_stock').eq('id', oldRecord.part_id).single();
      if (item) {
        let newStock = Number(item.current_stock) || 0;
        if (key === 'parts_intake') newStock -= Number(oldRecord.intake_quantity) || 0;
        else if (key === 'parts_output') newStock += Number(oldRecord.actual_output_quantity) || 0;
        else if (key === 'parts_movements') newStock -= Number(oldRecord.quantity) || 0;
        await sb.from('parts_inventory').update({ current_stock: newStock }).eq('id', oldRecord.part_id);
      }
    }
  } catch (e) {
    console.error('revertInventoryEffect failed:', e);
    toast(t('errorPrefix') + ' Inventory rollback failed: ' + e.message, 5000);
    throw e;
  }
}

async function applyInventoryEffect(key, record) {
  if (key === 'fuel_intake') {
    await applyFuelIntakeToInventory(record.fuel_type, record.tank_location, record.intake_quantity, record.unit_price);
  } else if (key === 'fuel_output') {
    await applyFuelOutputToInventory(record.fuel_type, record.tank_location, record.liters_added);
  } else if (key === 'inputs_intake') {
    await applyIntakeToInventory('inputs_inventory', record.input_id, record.intake_quantity, record.unit_price);
  } else if (key === 'inputs_output') {
    await applyOutputToInventory('inputs_inventory', record.input_id, record.actual_output_quantity);
  } else if (key === 'inventory_movements') {
    await applyMovementToInventory('inputs_inventory', record.input_id, record.quantity);
  } else if (key === 'parts_intake') {
    await applyIntakeToInventory('parts_inventory', record.part_id, record.intake_quantity, record.unit_price);
  } else if (key === 'parts_output') {
    await applyOutputToInventory('parts_inventory', record.part_id, record.actual_output_quantity);
  } else if (key === 'parts_movements') {
    await applyMovementToInventory('parts_inventory', record.part_id, record.quantity);
  }
}

async function checkApprovalNeeded(key, record) {
  if (key !== 'fuel_intake' && key !== 'inputs_intake' && key !== 'parts_intake') return { needed: false };
  let oldAvg = 0, newAvg = 0, oldStock = 0, qty = 0, price = 0;
  if (key === 'fuel_intake') {
    const item = await getFuelItem(record.fuel_type, record.tank_location);
    oldAvg = Number(item?.avg_unit_price) || 0;
    oldStock = Number(item?.current_stock) || 0;
  } else if (key === 'inputs_intake') {
    const { data: item } = await sb.from('inputs_inventory').select('current_stock, avg_unit_price').eq('id', record.input_id).single();
    oldAvg = Number(item?.avg_unit_price) || 0;
    oldStock = Number(item?.current_stock) || 0;
  } else if (key === 'parts_intake') {
    const { data: item } = await sb.from('parts_inventory').select('current_stock, avg_unit_price').eq('id', record.part_id).single();
    oldAvg = Number(item?.avg_unit_price) || 0;
    oldStock = Number(item?.current_stock) || 0;
  }
  qty = Number(record.intake_quantity) || 0;
  price = Number(record.unit_price) || 0;
  const newStock = oldStock + qty;
  newAvg = newStock > 0 ? ((oldStock * oldAvg) + (qty * price)) / newStock : 0;
  const deviation = oldAvg > 0 ? ((newAvg - oldAvg) / oldAvg) * 100 : 0;
  return { needed: Math.abs(deviation) > PRICE_DEVIATION_THRESHOLD, deviation, oldAvg, newAvg };
}

async function checkStockShortage(key, record) {
  if (key !== 'fuel_output' && key !== 'inputs_output' && key !== 'parts_output') return { shortage: false };
  let currentStock = 0, requiredQty = 0, itemName = '';
  if (key === 'fuel_output') {
    const item = await getFuelItem(record.fuel_type, record.tank_location);
    currentStock = Number(item?.current_stock) || 0;
    requiredQty = Number(record.liters_added) || 0;
    itemName = `${record.fuel_type} (${record.tank_location})`;
  } else if (key === 'inputs_output') {
    const { data: item } = await sb.from('inputs_inventory').select('input_name, current_stock').eq('id', record.input_id).single();
    currentStock = Number(item?.current_stock) || 0;
    requiredQty = Number(record.actual_output_quantity) || 0;
    itemName = item?.input_name || 'Input';
  } else if (key === 'parts_output') {
    const { data: item } = await sb.from('parts_inventory').select('part_name, current_stock').eq('id', record.part_id).single();
    currentStock = Number(item?.current_stock) || 0;
    requiredQty = Number(record.actual_output_quantity) || 0;
    itemName = item?.part_name || 'Part';
  }
  return { shortage: currentStock - requiredQty < 0, currentStock, requiredQty, itemName };
}

async function saveRecord(key, editId) {
  const saveBtn = document.getElementById('btn_save_record');
  if (saveBtn) {
    if (saveBtn.disabled) return;
    saveBtn.disabled = true;
    saveBtn.style.opacity = '0.6';
    saveBtn.style.cursor = 'not-allowed';
  }
  try {
    await _doSaveRecord(key, editId);
  } finally {
    if (saveBtn) {
      saveBtn.disabled = false;
      saveBtn.style.opacity = '';
      saveBtn.style.cursor = '';
    }
  }
}

async function _doSaveRecord(key, editId) {
  const cfg = TABLES[key];
  const record = {};
  const errors = [];
  for (const f of cfg.fields) {
    if (f.previewOnly) continue;
    const id = 'fld_' + f.col;
    let val;
    if (f.type === 'multilink' || f.type === 'multiselect') {
      const container = document.getElementById(id);
      if (!container) continue;
      val = Array.from(container.querySelectorAll('input:checked')).map(c => f.type === 'multilink' ? parseInt(c.value) : c.value);
    } else if (f.type === 'datetime') {
      const dateEl = document.getElementById(id + '__date');
      const timeEl = document.getElementById(id + '__time');
      val = (dateEl && dateEl.value) ? mergeDatetime(dateEl.value, timeEl ? timeEl.value : '00:00') : null;
    } else if (f.type === 'range') {
      const el = document.getElementById(id);
      val = el ? parseFloat(el.value) : null;
    } else {
      const el = document.getElementById(id);
      if (!el) continue;
      val = el.value;
      if (f.type === 'number') val = val === '' ? null : parseFloat(val);
      else if (f.type === 'link') val = val === '' ? null : parseInt(val);
      else if (f.type === 'date') val = val ? ddmmyyyyToISO(val) : null;
      else if (val === '') val = null;
    }
    if (f.required && (val === null || val === undefined || val === '' || (Array.isArray(val) && val.length === 0))) {
      errors.push(f.label);
    }
    record[f.col] = val;
  }
  if (errors.length > 0) { toast(t('requiredFields') + errors.join(', '), 5000); return; }
  record.created_by = currentUser.id;

  let oldRecord = null;
  if (editId) {
    const { data } = await sb.from(key).select('*').eq('id', editId).single();
    oldRecord = data;
  }

  const approval = await checkApprovalNeeded(key, record);
  if (approval.needed) {
    const result = await askAdminApproval(approval.deviation, approval.oldAvg, approval.newAvg);
    if (!result.approved) { toast(t('opCancelled')); return; }
    record.price_deviation_pct = Number(approval.deviation.toFixed(2));
    record.approved_by = result.adminId;
    record.approved_at = new Date().toISOString();
    record.approval_note = result.note || null;
  }

  const shortage = await checkStockShortage(key, record);
  if (shortage.shortage) {
    const ok = await askStockShortage(shortage.currentStock, shortage.requiredQty, shortage.itemName);
    if (!ok) { toast(t('opCancelled')); return; }
  }

  if (editId && oldRecord) {
    try {
      await revertInventoryEffect(key, oldRecord);
    } catch (e) {
      toast(t('errorPrefix') + ' ' + e.message, 5000);
      return;
    }
  }

  let recordId = editId;
  if (editId) {
    const { error } = await sb.from(key).update(record).eq('id', editId);
    if (error) { toast(t('errorPrefix') + error.message); return; }
    toast(t('recordUpdated'));
  } else {
    let attempts = 0;
    let inserted = false;
    while (attempts < 3) {
      const { data, error } = await sb.from(key).insert(record).select('id').single();
      if (!error) {
        recordId = data.id;
        inserted = true;
        toast(t('recordSaved'));
        break;
      }
      if (error.code === '23505' && cfg.autoNumber) {
        record[cfg.autoNumber.field] = await generateNextDocNumber(cfg.autoNumber, key);
        attempts++;
        continue;
      }
      toast(t('errorPrefix') + error.message);
      return;
    }
    if (!inserted) {
      toast(t('errorPrefix') + ' Could not generate unique document number after 3 attempts', 5000);
      return;
    }
  }

  await applyInventoryEffect(key, record);

  if (cfg.hasPlannedInputs) {
    await sb.from('inputs_per_work_order').delete().eq('work_order_id', recordId);
    const rows = document.querySelectorAll('#plannedInputsRows .planned-row');
    const planned = [];
    rows.forEach(r => {
      const inputId = r.querySelector('.planned-input-select')?.value;
      const qty = parseFloat(r.querySelector('.planned-qty')?.value);
      if (inputId && !isNaN(qty)) {
        planned.push({ work_order_id: recordId, input_id: parseInt(inputId), quantity_used: qty, unit: r.querySelector('.planned-unit')?.value || null });
      }
    });
    if (planned.length > 0) await sb.from('inputs_per_work_order').insert(planned);
  }

  if (cfg.hasPartsUsed) {
    await sb.from('maintenance_parts').delete().eq('maintenance_log_id', recordId);
    const rows = document.querySelectorAll('#partsUsedRows .planned-row');
    const parts = [];
    rows.forEach(r => {
      const partId = r.querySelector('.planned-input-select')?.value;
      const qty = parseFloat(r.querySelector('.planned-qty')?.value);
      const price = parseFloat(r.querySelector('.planned-price')?.value) || 0;
      if (partId && !isNaN(qty)) {
        parts.push({ maintenance_log_id: recordId, part_id: parseInt(partId), quantity_used: qty, unit: r.querySelector('.planned-unit')?.value || null, system_unit_price: price, total_value: qty * price });
      }
    });
    if (parts.length > 0) await sb.from('maintenance_parts').insert(parts);
  }

  openModule(key);
}

async function deleteRecord(key, id) {
  if (!confirm(t('confirmDelete'))) return;
  const cfg = TABLES[key];
  let record = null;
  if (cfg) {
    const { data } = await sb.from(key).select('*').eq('id', id).single();
    record = data;
  }
  if (key === 'work_orders') {
    await sb.from('inputs_per_work_order').delete().eq('work_order_id', id);
  }
  if (key === 'maintenance_logs') {
    await sb.from('maintenance_parts').delete().eq('maintenance_log_id', id);
  }
  if (record) {
    try {
      await revertInventoryEffect(key, record);
    } catch (e) {
      toast(t('errorPrefix') + ' ' + e.message, 5000);
      return;
    }
  }
  const { error } = await sb.from(key).delete().eq('id', id);
  if (error) { toast(t('errorPrefix') + error.message); return; }
  toast(t('recordDeleted'));
  openModule(key);
}

      const status = current <= 0 ? 'out' : current <= (Number(item.minimum_stock) || 0) ? 'low' : 'ok';
      const badgeClass = status === 'out' ? 'inv-out' : status === 'low' ? 'inv-low' : 'inv-ok';
      const badgeText = status === 'out' ? t('outOfStock') : status === 'low' ? t('lowStock') : t('ok');
      html += `<div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <strong style="font-size:15px">${escapeHtml(String(item.part_name))}</strong>
          <span><span class="inv-badge ${clsBadge}">${cls}</span> <span class="inv-badge ${badgeClass}">${badgeText}</span></span>
        </div>
        <div class="inv-row"><span class="label">${t('code')}</span><span class="value">${escapeHtml(String(item.part_code || '-'))}</span></div>
        <div class="inv-row"><span class="label">Location</span><span class="value">${escapeHtml([item.warehouse_zone, item.bin_location].filter(Boolean).join(' / ') || '-')}</span></div>
        <div class="inv-row" style="border-top:2px solid #333;padding-top:10px;margin-top:6px">
          <span class="label" style="font-weight:700">${t('currentStock')}</span>
          <span class="value" style="font-size:18px">${current.toFixed(1)}</span>
        </div>
        <div class="inv-row"><span class="label">${t('minimumStock')}</span><span class="value">${Number(item.minimum_stock || 0).toFixed(1)}</span></div>
        <div class="inv-row"><span class="label">${t('avgPrice')}</span><span class="value">${Number(item.avg_unit_price || 0).toFixed(4)}</span></div>
      </div>`;
    }
    html += `</div>`;
  }
  content.innerHTML = html;
}

// ============================================================
// EQUIPMENT REPORT
// ============================================================
async function showEquipmentReport() {
  const content = document.getElementById('content');
  const { data: equipment } = await sb.from('equipment').select('*');
  const { data: logs } = await sb.from('maintenance_logs').select('*');

  let html = `<div class="section-header">
    <button class="back-btn" onclick="goBack()">← ${t('back')}</button>
    <h3>Equipment Report</h3>
  </div><div class="form-container">`;

  for (const eq of (equipment || [])) {
    const eqLogs = (logs || []).filter(l => l.equipment_id === eq.id);
    const totalCost = eqLogs.reduce((s,l) => s + (Number(l.cost) || 0), 0);
    const totalDowntime = eqLogs.reduce((s,l) => s + (Number(l.downtime_hours) || 0), 0);
    const openCount = eqLogs.filter(l => l.status === 'Open' || l.status === 'In Progress').length;
    html += `<div class="card">
      <div style="margin-bottom:12px"><strong style="font-size:16px">${escapeHtml(String(eq.equipment_name))}</strong>
        <span style="color:#666;font-size:13px"> (${escapeHtml(String(eq.equipment_code || ''))})</span></div>
      <div class="report-summary">
        <div><div class="num">${eqLogs.length}</div><div class="lbl">${t('totalRepairs')}</div></div>
        <div><div class="num">${openCount}</div><div class="lbl">${t('open')}</div></div>
        <div><div class="num">${totalCost.toFixed(0)}</div><div class="lbl">${t('totalCost')}</div></div>
        <div><div class="num">${totalDowntime.toFixed(1)}</div><div class="lbl">${t('downtime')}</div></div>
      </div>
    </div>`;
  }
  html += `</div>`;
  content.innerHTML = html;
}

// ============================================================
// USER MANAGEMENT
// ============================================================
async function showUserManagement() {
  const content = document.getElementById('content');
  const { data, error } = await sb.from('app_users').select('*').order('id');
  if (error) { toast(t('errorPrefix') + error.message); return; }

  let html = `<div class="section-header">
    <button class="back-btn" onclick="goBack()">← ${t('back')}</button>
    <h3>${t('userMgmt')}</h3>
    <button class="btn btn-primary btn-sm" onclick="showUserForm()">+ ${t('addUser')}</button>
  </div><div class="list-container">`;

  for (const u of (data || [])) {
    const viewCount = u.role === 'admin' ? 'All' : (u.allowed_tables ? u.allowed_tables.length : 0) + ' visible';
    const editCount = u.role === 'admin' ? 'All' : (u.editable_tables ? u.editable_tables.length : 0) + ' editable';
    html += `<div class="list-item">
      <div class="info">
        <div class="main">${escapeHtml(String(u.display_name || u.username))}</div>
        <div class="sub">@${escapeHtml(String(u.username))} · ${u.role} · ${viewCount}, ${editCount}</div>
      </div>
      <div class="actions">
        <button onclick="showUserQR('${escapeHtml(String(u.username))}','${escapeHtml(String(u.display_name || u.username))}')" title="QR Code">📱</button>
        <button onclick="showUserForm(${u.id})" title="${t('edit')}">✏️</button>
        ${u.username !== 'admin' ? `<button onclick="deleteUser(${u.id})" title="${t('delete')}">🗑️</button>` : ''}
      </div>
    </div>`;
  }
  html += `</div>`;
  content.innerHTML = html;
}

function showUserQR(username, displayName) {
  const baseUrl = window.location.href.split('?')[0].split('#')[0];
  const loginUrl = baseUrl + '?u=' + encodeURIComponent(username);
  const old = document.getElementById('qrModal');
  if (old) old.remove();
  const modal = document.createElement('div');
  modal.id = 'qrModal';
  modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px';
  modal.onclick = function(e) { if (e.target === modal) modal.remove(); };
  modal.innerHTML = `
    <div style="background:#fff;border-radius:16px;padding:28px;text-align:center;max-width:340px;width:100%">
      <h3 style="color:#1a5632;margin-bottom:4px">📱 ${escapeHtml(displayName)}</h3>
      <p style="color:#666;font-size:13px;margin-bottom:16px">Scan with phone camera to login</p>
      <div id="userQrContainer" style="display:inline-block;padding:8px;background:#fff;border-radius:8px"></div>
      <p style="font-size:11px;color:#999;margin-top:8px">Username: <strong>${escapeHtml(username)}</strong></p>
      <button class="btn btn-outline" style="width:100%;margin-top:16px" onclick="document.getElementById('qrModal').remove()">${t('close')}</button>
    </div>`;
  document.body.appendChild(modal);
  const qrContainer = document.getElementById('userQrContainer');
  try {
    if (typeof QRCode !== 'undefined') {
      new QRCode(qrContainer, {
        text: loginUrl,
        width: 240,
        height: 240,
        colorDark: '#1a5632',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    } else {
      qrContainer.textContent = loginUrl;
    }
  } catch(e) {
    console.warn('QR generation failed:', e);
  }
}

async function showUserForm(editId) {
  const content = document.getElementById('content');
  let user = {};
  if (editId) {
    const { data } = await sb.from('app_users').select('*').eq('id', editId).single();
    user = data || {};
  }
  const permTables = Object.entries(TABLES).filter(([k,v]) => !v.isAdmin);
  const userView = user.allowed_tables || [];
  const userEdit = user.editable_tables || [];
  let permHtml = '';
  for (const [k,v] of permTables) {
    const isEdit = userEdit.includes(k);
    const isView = userView.includes(k);
    const state = isEdit ? 'edit' : (isView ? 'view' : 'none');
    permHtml += `<div class="perm-row">
      <span style="font-size:13px">${v.icon} ${v.label}</span>
      <select class="perm-select" data-table="${k}">
        <option value="none" ${state==='none'?'selected':''}>${t('none')}</option>
        <option value="view" ${state==='view'?'selected':''}>${t('viewOnly')}</option>
        <option value="edit" ${state==='edit'?'selected':''}>${t('viewEdit')}</option>
      </select>
    </div>`;
  }
  content.innerHTML = `<div class="section-header">
    <button class="back-btn" onclick="showUserManagement()">← ${t('back')}</button>
    <h3>${editId ? t('editUser') : t('addUser')}</h3>
  </div>
  <div class="form-container"><div class="card">
    <div class="form-group"><label>${t('username')}</label><input id="usr_username" value="${escapeHtml(user.username || '')}" placeholder="username"></div>
    <div class="form-group"><label>${t('displayName')}</label><input id="usr_displayname" value="${escapeHtml(user.display_name || '')}" placeholder="Display name"></div>
    <div class="form-group"><label>${editId ? t('newPwd') + ' (blank = keep)' : t('password')}</label><input id="usr_password" type="password"></div>
    <div class="form-group"><label>${t('role')}</label><select id="usr_role">
      <option value="staff" ${user.role === 'staff' ? 'selected' : ''}>${t('staff')}</option>
      <option value="admin" ${user.role === 'admin' ? 'selected' : ''}>${t('admin')}</option>
    </select></div>
    <div class="form-group" id="permGroup">
      <label>${t('tablePerms')}</label>
      ${permHtml}
    </div>
    <button class="btn btn-primary" style="width:100%" onclick="saveUser(${editId || 'null'})">${editId ? t('updateUser') : t('createUser')}</button>
  </div></div>`;
}

async function saveUser(editId) {
  const username = document.getElementById('usr_username').value.trim();
  const displayName = document.getElementById('usr_displayname').value.trim();
  const password = document.getElementById('usr_password').value;
  const role = document.getElementById('usr_role').value;
  if (!username) { toast('Username required'); return; }
  let allowedTables = []; let editableTables = [];
  if (role === 'admin') {
    allowedTables = Object.keys(TABLES).filter(k => !TABLES[k].isAdmin);
    editableTables = [...allowedTables];
  } else {
    for (const sel of document.querySelectorAll('.perm-select')) {
      const table = sel.dataset.table;
      if (sel.value === 'view') allowedTables.push(table);
      else if (sel.value === 'edit') { allowedTables.push(table); editableTables.push(table); }
    }
    if (allowedTables.length === 0) { toast('Select at least one table'); return; }
  }
  const record = { username, display_name: displayName, role, allowed_tables: allowedTables, editable_tables: editableTables };
  if (password) record.password_hash = await sha256(password);
  else if (!editId) { toast('Password required for new user'); return; }
  if (editId) {
    const { error } = await sb.from('app_users').update(record).eq('id', editId);
    if (error) { toast(t('errorPrefix') + error.message); return; }
    toast(t('recordUpdated'));
  } else {
    const { error } = await sb.from('app_users').insert(record);
    if (error) { toast(t('errorPrefix') + error.message); return; }
    toast(t('recordSaved'));
  }
  showUserManagement();
}

async function deleteUser(id) {
  if (!confirm(t('confirmDelete'))) return;
  const { error } = await sb.from('app_users').delete().eq('id', id);
  if (error) { toast(t('errorPrefix') + error.message); return; }
  toast(t('recordDeleted'));
  showUserManagement();
}

const savedSession = localStorage.getItem('santagro_session');
if (savedSession) {
  const url = EMBEDDED_URL || localStorage.getItem('santagro_sb_url');
  const key = EMBEDDED_KEY || localStorage.getItem('santagro_sb_key');
  if (url && key) {
    sb = supabase.createClient(url, key);
    currentUser = JSON.parse(savedSession);
  }
}

init();

if (currentUser) {
  document.getElementById('loginScreen') && (document.getElementById('loginScreen').style.display = 'none');
  document.getElementById('configScreen') && (document.getElementById('configScreen').style.display = 'none');
  document.getElementById('mainApp').style.display = 'block';
  document.getElementById('userName').textContent = currentUser.displayName || currentUser.username;
  applyI18n();
  showDashboard();
} else {
  applyI18n();
}
